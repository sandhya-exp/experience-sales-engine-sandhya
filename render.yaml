# Render blueprint for the Guided Selling module (FastAPI, in-memory store).
# The Next.js workspace is deployed on Vercel; set its QUOTE_WORKSPACE_URL to this service's URL.
services:
  - type: web
    name: sales-engine-guided-selling
    runtime: python
    rootDir: modules/guided-selling
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: HANDOFF_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.4"
