# Render blueprint: one service, one container, built from the Dockerfile at
# the repo root. The Sales Engine is a single Next.js application — one deploy,
# one URL, one log stream.
services:
  - type: web
    name: experience-sales-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login
    envVars:
      # Supabase connection string.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Shared secret accepted on GET /api/handoff/{leadId} (docs/QUOTE_HANDOFF.md).
      - key: HANDOFF_API_KEY
        generateValue: true
      # Optional: AI Opportunity Intelligence runs deterministically without it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: Google sign-in. Add the deployed callback URL to the OAuth client.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ALLOWED_DOMAINS
        sync: false
      # Optional: real discovery-call availability (docs/GOOGLE-CALENDAR.md).
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CALENDAR_IMPERSONATE
        sync: false
      - key: SALES_TIMEZONE
        value: America/New_York
